name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  cmake-windows:
    name: CMake Qt 6.6.3 windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.3
          arch: win64_msvc2019_64
          modules: qtscxml
          cache: false

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIALWIDGETS_BUILD_EXAMPLES=ON
          -DQTMATERIALWIDGETS_BUILD_FULL_ICON_PACK=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Build examples
        run: cmake --build build --config Release --target examples --parallel

      - name: Install package
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/install"

      - name: Configure consumer
        run: >
          cmake -S examples/consumer -B build-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Build consumer
        run: cmake --build build-consumer --config Release --parallel

  cmake-extended:
    name: CMake Qt ${{ matrix.qt-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt-version: 6.6.3
            qt-arch: gcc_64
          - os: macos-15-intel
            qt-version: 6.6.3
            qt-arch: clang_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: ${{ matrix.qt-arch }}
          modules: qtscxml
          cache: false

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIALWIDGETS_BUILD_EXAMPLES=ON
          -DQTMATERIALWIDGETS_BUILD_FULL_ICON_PACK=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Build examples
        run: cmake --build build --config Release --target examples --parallel

      - name: Install package
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/install"

      - name: Configure consumer
        run: >
          cmake -S examples/consumer -B build-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Build consumer
        run: cmake --build build-consumer --config Release --parallel

      - name: Run consumer smoke
        if: runner.os == 'Linux'
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/install/lib:${LD_LIBRARY_PATH}"
          export QT_QPA_PLATFORM=offscreen
          ./build-consumer/qt-material-widgets-consumer

  cmake-minimal:
    name: CMake minimal Qt 6.6.3 ubuntu-latest
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.3
          arch: gcc_64
          modules: qtscxml
          cache: false

      - name: Configure minimal
        run: >
          cmake -S . -B build-minimal -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIALWIDGETS_BUILD_EXAMPLES=OFF
          -DQTMATERIALWIDGETS_BUILD_FULL_ICON_PACK=OFF
          -DBUILD_TESTING=OFF

      - name: Build minimal
        run: cmake --build build-minimal --config Release --parallel

      - name: Check minimal target surface
        run: |
          cmake --build build-minimal --target help > build-minimal-targets.txt
          if grep -E '(^|[[:space:]])examples($|:)' build-minimal-targets.txt; then
            echo "examples target must not be registered in minimal configuration"
            exit 1
          fi
          if grep -E 'qtmaterialwidgets_smoke_test' build-minimal-targets.txt; then
            echo "test target must not be registered in minimal configuration"
            exit 1
          fi

      - name: Install minimal package
        run: cmake --install build-minimal --config Release --prefix "${{ github.workspace }}/install-minimal"

      - name: Configure minimal consumer
        run: >
          cmake -S examples/consumer -B build-consumer-minimal -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-minimal"

      - name: Build minimal consumer
        run: cmake --build build-consumer-minimal --config Release --parallel
